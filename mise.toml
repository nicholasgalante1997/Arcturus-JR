# mise-en-place <https://mise.jdx.dev/configuration.html>

[tools]
bun = { version = "1.3.2", os = ["linux", "macos"], postinstall = "echo \"Installed bun v$(bun -v) with mise\"" }
node = { version = "24.6.0", os = ["linux", "macos"], postinstall = "echo \"Installed bun v$(node -v) with mise\"" }

[env]
_.file = [".env"]
_.path = [
    # adds a path relative to the project root (config_root)
    # We need this added to path, in order to use commands like
    # [turbo, webpack, etc]
    # that our package.json#scripts expects to load from node_modules/.bin
    "{{config_root}}/node_modules/.bin",
]

[tasks]

[tasks.install]
description = "Installs all project dependencies"
run = "bun install --frozen-lockfile"

[tasks.test]
description = "Runs the test suite"
run = "bun run test"
depends = ["install"]

[tasks.lint]
description = "Runs the linter"
run = "bun run lint"
depends = ["install"]

[tasks.build]
description = "Builds the project"
run = "bun run build"
depends = ["install"]

[tasks.start]
description = "Starts the application"
run = "bun run start"
depends = ["build"]

[tasks.dev]
description = "Starts the application in development mode"
run = "bun run dev"
depends = ["install"]

[tasks.serve]
description = "Serves the built application"
run = "bun run serve"
depends = ["build"]

[tasks.clean]
description = "Cleans the project build artifacts"
run = "bun run clean"

# =============================================================================
# loclaude - Docker Management
# =============================================================================
# Commands for managing the Ollama and Open WebUI containers

[tasks."lc:up"]
description = "Start Ollama and Open WebUI containers"
run = "loclaude docker-up"

[tasks."lc:down"]
description = "Stop all containers"
run = "loclaude docker-down"

[tasks."lc:restart"]
description = "Restart all containers"
run = "loclaude docker-restart"

[tasks."lc:status"]
description = "Show container status"
run = "loclaude docker-status"

[tasks."lc:logs"]
description = "Follow container logs"
run = "loclaude docker-logs --follow"

# =============================================================================
# loclaude - Model Management
# =============================================================================
# Commands for managing Ollama models (download, remove, list)

[tasks."lc:models"]
description = "List installed models"
run = "loclaude models"

[tasks."lc:pull"]
description = "Pull a model (usage: mise run pull <model-name>)"
run = "loclaude models-pull {{arg(name='model')}}"

[tasks."lc:pull:recommended"]
description = "Pull the recommended coding model"
run = "loclaude models-pull qwen3-coder:30b"

# =============================================================================
# Claude Code
# =============================================================================
# Commands for running Claude Code with local Ollama

[tasks."lc:claude"]
description = "Run Claude Code with local Ollama"
run = "loclaude run"

[tasks."lc:claude:model"]
description = "Run Claude with specific model (usage: mise run claude:model <model>)"
run = "loclaude run -m {{arg(name='model')}}"

# =============================================================================
# Diagnostics
# =============================================================================
# Commands for checking system health and troubleshooting

[tasks."lc:doctor"]
description = "Check system requirements"
run = "loclaude doctor"

[tasks."lc:gpu"]
description = "Check GPU status (requires NVIDIA GPU)"
run = "docker exec ollama nvidia-smi"

[tasks."lc:config"]
description = "Show current configuration"
run = "loclaude config"
